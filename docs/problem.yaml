# T1 팀 문제정의. 종이 캔버스(2026-10-29, 팀원 JW·TK·HN·SG·HE)와 팀이 만든 초안(2026-10-29)에서 옮김.
# "(팀 초안)" 표시는 종이에는 없고 팀이 초안으로 적은 내용이다. 2-A에서 다지면서 고친다.
# 종이와 초안에 없는 내용은 null 또는 []로 둔다.
# 최신 정리본(2026-10-29, 팀이 최신으로 확정): 캔버스 ①~⑥을 canvas에 옮김. "(정리본)" 표시가 이 내용이다.
# 이전 초점(2026-10-29): 정량 전형(서류·인적성·코테)을 통과한 뒤 면접 정성평가에서 당황하는 구직자.
#   이유: 서류 쪽은 비슷한 서비스가 많지만 면접 쪽은 그렇지 않아 면접에 집중하는 게 경쟁력이 있다고 봄. Claude로 검색해 확인, 출처는 없음(팀 판단).

# 2026-10-30 근거 정리: 공개 통계(sources S1~S13)와 맞지 않거나 근거가 없는 주장은 빼고, 논리 비약을 고침(학생 요청).
#   뺀 것: 정량 컷(통계와 반대, S4·S5), 정보 비대칭(근거 약하고 해법과 무관), 고졸·초급 경력자 이직, 2차 고객(회사),
#   확장 대상(2~3학년), "지원 건당 수십 시간"(S10은 평균 7시간), 학원비, 잡다·원티드·하이잡 단점(확인 안 됨),
#   5 whys의 해법 순환 논리. 이전 내용은 git 기록에 있음.
#   "(가설)"은 아직 근거가 없어 검증해야 하는 문장이다. [S#]는 sources 번호.
# statement: 근거에 맞춰 다듬은 초안(2026-10-30). 팀 말로 확정 필요.
statement: >-
  직무 관련 경험은 있지만 평소 정리해 두지 않은 첫 구직 취준생이,
  자기 경험과 기여를 구체적으로 설명하지 못해 자소서 작성을 막막해하고
  면접의 강점·직무 질문에 제대로 답하지 못하는 문제
canvas:
  context: |-
    시간: 4학년 2학기·졸업예정자·신입 취준생의 공채 시즌 (공고 마감 직전 ~ 면접 직전)
    장소: 학교, 자취방, 도서관 등 혼자 서류를 쓰고 면접을 준비하는 공간
    반복 양상: 공고 확인 → 자소서 문항 앞에서 쓸 경험을 고르지 못함 [S2]
      → 문항을 보고 지원을 포기하거나(65.5%) [S3], AI로 초안을 채움(84%) [S6]
      → 면접에서 자소서 내용을 구체적으로 풀어내지 못함 [S1][S9]
  customer: |-
    처음 구직하는 취준생(4학년 2학기·졸업예정).
    프로젝트·동아리·대외활동 경험은 있지만 기록을 남기지 않아 말 말고는 증명할 게 없는 사람.
    신입 구직자의 87.7%가 자소서 쓰기를 막막해함 [S2]
  root_problem: |-
    왜 생기나
    - 기업은 신입을 뽑을 때도 직무 관련 경험을 가장 중요하게 보고(67.6%) [S4],
      직무역량은 주로 실무면접으로 판단한다(35.2%) [S5].
    - 그런데 취준생은 경험을 평소에 정리해 두지 않아(47.3%) [S2] 무엇을 써야 할지 막막해하고(69.9%) [S3],
      면접에서는 강점 소개(37.5%)·직무 전문성(32.2%) 질문을 가장 어려워한다 [S1].
      면접 후 후회하는 이유 1위는 "답변을 제대로 말하지 못해서"(50.1%) [S9].
    왜 아직 못 고쳤나
    - 취준생 대부분은 AI로 자소서 초안을 쓴다(84%) [S6]. 기업은 AI 자소서를 "독창성이 없다"며 부정적으로 보고(64.1%) [S8],
      구직자도 AI 때문에 자소서 전형의 의미가 퇴색했다고 본다(70%) [S7].
      (가설) 문장은 채워지지만, 내 경험을 꺼내 내 말로 설명해 보는 과정은 건너뛴다.
    - 자소서·이력서 기반 꼬리질문 AI 모의면접은 이미 있다 [S11][S12].
      (가설, 확인 필요) 이 서비스들은 이미 쓴 서류에서 출발하므로, 서류에 담을 경험을 정리하는 앞 단계는 다루지 않는다.
  impact:
    feeling: |-
      (팀원 경험 E1·E3) "머리가 하얘졌다", "준비한 건 다 말도 못 했다", 끝나고 남는 후회와 자기 의심.
      "내 역량은 100인데 면접장만 가면 30이 되는 것 같아"
      (넓은 표본) 구직자의 75.1%가 면접 후 후회한 경험이 있고, 면접 중 탈락을 예감하면 29.1%가 "자포자기했다" [S9]
    measurable: |-
      - 자소서 1개 작성에 평균 7시간 [S10]
      - 자소서 항목을 보고 지원 자체를 포기한 경험 65.5%. 이유 1위는 "답변할만한 경험이나 스펙이 없어서" 61.5% [S3]
      지표(이름만, 값은 아직 없음): 자소서 1개 작성 시간, 면접 진출 대비 최종 합격률, 면접 준비에 쓴 시간
  alternatives:
    # 2026-10-30: how_used·shortcoming을 근거(sources)에 맞춰 교체. why_ours는 팀원 수정안(2026-10-29 밤) 그대로.
    # (설계)는 효과를 검증하지 않은 설계 기준.
    - how_used: |-
        A1: 범용 AI로 자소서 초안·예상 질문 만들기
        취준생의 98%가 취업 준비에 AI를 쓰고, 자소서 초안 작성(84%)·면접 예상 질문 생성(67%)에 쓴다 [S6]
      shortcoming: |-
        결과가 비슷해져 기업은 "독창성이 없다"며 부정적으로 본다(64.1%) [S8].
        (가설) 경험을 정리하지 않은 채(47.3%) [S2] 초안을 받으면, 면접에서 그 내용을 내 말로 풀어낼 재료가 없다.
      why_ours: |-
        (설계) 자소서의 주장에 연결된 사실을 사용자에게 묻고, 설명된 부분과 보완할 부분을 저장한다.
        답변 문장을 대신 완성하는 것보다 사용자가 경험을 설명하고 다른 각도의 질문으로 다시 연습하는 흐름에 집중한다.
        범용 AI보다 효과적인지는 동일한 경험으로 비교 검증한다.
    - how_used: |-
        A2: 서류 기반 AI 모의면접 서비스
        사람인 AI 모의면접(이력서·공고 기반 질문, 꼬리질문) [S11], 코드잇 어센트(이력서·자소서 기반, 꼬리질문) [S12]
      shortcoming: |-
        사람인 정가 1회 27,500원 [S11].
        (가설, 확인 필요) 이미 쓴 서류에서 질문을 만들기 때문에, 서류에 담길 경험을 정리하는 앞 단계는 없다.
      why_ours: |-
        (설계) 자소서에서 설명할 사실을 찾고, 그 사실을 면접 질문·답변·피드백·재연습에 연결한다.
        한 번의 면접 결과보다 같은 경험을 다른 질문에도 설명할 수 있도록 보완하는 과정을 제공한다.
        이 연결 과정이 기존 서비스에 없는 독점 기능이라고 단정하지 않는다.
    - how_used: |-
        A3: 합격 자소서 참고·주변 첨삭
        자소서가 어려울 때 합격 자소서 참고 50.3%, 주변의 첨삭 23.2%, 특별히 하는 것이 없다 19.5% [S3]
      shortcoming: |-
        (가설) 남의 경험으로 쓴 글을 참고해도 내 경험은 정리되지 않는다.
      why_ours: |-
        (설계) 혼자서도 반복 연습하고, 이전 답변에서 부족했던 설명을 다음 연습에 이어서 사용할 수 있게 한다.
        실제 면접관이나 현직자의 피드백을 대체한다고 주장하지 않는다.
# ===== 대상 PERSONAS (P1, P2) =====
personas:
  # 팀 답 그대로(2026-10-29).
  - id: P1
    description: >-
      첫 구직에 나선 4학년 2학기 및 졸업예정 취준생. 동아리, 해커톤 등 7~8개의 팀 프로젝트를 치열하게 수행했지만,
      과정 기록(회의록, 톡방)이 모두 휘발되어 "내가 한 것을 말 말고는 객관적으로 증명할 수 없는" 처지에 놓인 사람.
    source: 팀 작성(2026-10-29 대화). 출처 따로 말하지 않음
  - id: P2
    description: >-
      시각적 결과물(코드, 디자인)이 남지 않아 '협업과 소통 과정' 자체가 핵심 역량임에도 이를 포트폴리오로 입증하기 막막한 기획/마케팅 직무 지망생.
    source: 팀 브레인스토밍 (2026-10-29)
# ===== 실제 경험 EXPERIENCES (E1, E2, E3) =====
experiences:
  - id: E1
    when: 2026년 초
    what_happened: >-
      소프트웨어 마에스트로 면접. 떨려서 제대로 답을 못 하고 꼬리질문에 막혔다.
      준비한 답만 외우다 보니 꼬리질문에 경험을 못 꺼냈다. 처음 해 보는 면접이라 어떻게 진행되는지 몰랐다.
    workaround: 억지로 짜내려 했으나 결국 답변을 다 하지 못하고 무너졌다. 준비한 대본만 외워 갔다.
    feeling: 떨렸다. 머리가 하얘지고, 끝나고 깊은 자기 의심에 빠졌다.
    quote: 내 역량은 100인데 면접장만 가면 30이 되는 것 같아. 준비한 건 다 말도 못 했어.
    source: 팀원 본인의 실제 경험(2026-10-29 대화). 막힌 꼬리질문의 구체적 내용은 학생 답 대기
  - id: E2
    when: 약 1년 전(2026-10-29 기준)
    what_happened: >-
      국내 주요 콘텐츠·IT 플랫폼 기업의 '서비스 기획(PM) 및 콘텐츠 에디터' 연계형 인턴 공고.
      포트폴리오 파일 제출보다 자기소개서의 '협업 과정 및 갈등 해결 에피소드'와 '구체적 기여도(%)'를 정밀하게 요구한 서류 전형.
      자기소개서 문항 "팀 프로젝트 중 이견을 조율하고 문제를 해결한 과정과 본인의 구체적인 기여도를 서술하시오" 앞에서 막혔다.
      어떤 답변이 내 경험을 살리면서 좋은 자기소개서가 될지 몰랐다.
      쌓아 온 과정을 정제하고 기업에 맞춰 자소서를 매번 각각 작성하는 일이 어려웠다.
    workaround: >-
      어떻게든 써서 냈지만 좋은 성과가 따라주지 않았다.
      자소서를 직접 작성하는 동안 다른 기업에 서류를 넣을 시간이 부족했다.
      (팀이 지인 이야기를 듣고 정리) 팀장을 맡아 갈등을 중재했지만 제출할 회의록·데이터가 없어
      상투적인 문장("경청하고 소통해서 잘 해결했다")을 쓸 수밖에 없었다. 며칠 동안 붙잡고 겨우 냈지만 서류에서 불합격했고,
      그러느라 같은 주에 마감이던 다른 기업 두 곳은 서류를 써 보지도 못했다.
    feeling: |-
      (팀이 지인 이야기를 듣고 정리)
      문항 앞에서 막혔을 때: 억울함과 깊은 자괴감, 실제 협업 노력을 객관적인 증거로 증명하지 못하는 무력감
      결과가 좋지 않았을 때: 허탈함과 심한 초조함, 한 공고에 시간을 다 빼앗겨 다른 기업 서류 기회까지 날려버린 공포
    quote: 동아리 회장·프로젝트 다 했는데 증명할 게 없네.
    source: 팀원의 지인(4학년 취준생)의 경험. 팀원이 지인에게 직접 들음(2026-10-29 대화). quote는 팀이 E2 항목에 적어 준 문장이며 지인이 한 말인지는 학생 답 대기
  - id: E3
    when: 몇 달 전(2026-10-29 기준)
    what_happened: >-
      마케팅/영업 직무 지원자. 대기업 실무진 다대일 압박 면접.
      "성과가 좋았다고 적혀 있는데, 여기서 본인의 역할을 빼도 전체 결과에 차이가 없지 않나?"라는 압박 꼬리질문을 받았다.
      원인(팀이 친구 이야기를 듣고 정리한 말, 친구가 직접 한 말은 아님): 외운 대본에 의존해 성과(Result)만 늘어놓았을 뿐, 압박 상황에서 내 주도적 행동(Action)을
      말로 즉석에서 풀어내는 실전 음성 순발력 및 담력 훈련이 안 되어 있었다.
    workaround: >-
      외운 대본에 의존해 성과만 늘어놓았다. 외운 범위를 벗어나자 답변이 중단됐다.
    feeling: >-
      머리가 하얗게 비었다. 면접 울렁증이 심해져 이후 지원 자체를 두려워하게 됐다.
    quote: >-
      "외운 대본에서 한 발짝만 벗어나니까 진짜 입도 뻥긋 못 하겠더라. 면접관이 '거기서 본인 빼도 결과는 똑같았을 것 같은데요?' 하고 딱 찌르는데,
      순간 머리가 새하얘지면서 어버버하다 정적만 흘렀어. 외운 문장 말고는 내 진짜 행동을 말로 바로 뱉어내는 실전 훈련이 전혀 안 되어 있다는 걸 깨닫고 나니까,
      이젠 면접장에 들어가는 것 자체가 너무 무서워."
    source: 친구의 경험. 팀이 "인터뷰/실제 사례 4"로 전달함(2026-10-29 대화). 정확한 면접 시점은 "몇 달 전"까지만 확인됨
# 다른 팀원들도 각자 면접 때문에 고민한 경험이 있다(2026-10-29). 언제·어느 면접인지는 학생 답 대기.
# 2026-10-30 학생 요청으로 찾은 자료. 모두 원문을 열어 확인함. claim의 숫자는 원문 그대로.
# S2·S3·S5·S9·S13은 2018~2019년 자료라 같은 질문의 최신 조사가 있으면 바꾼다.
sources:
  - id: S1
    url: https://www.etnews.com/20240508000246
    title: 잡코리아, "구직자 46% 채용 단계 중 '면접' 가장 어려워 해" (전자신문, 2024-05-08)
