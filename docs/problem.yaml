# 이전 초점(서류 탈락) 초안 personas. 2-A에서 면접 초점으로 재작성 전까지 보관.
#   - P1 난사형 지원자. 4학년 2학기, 직무 미확정, 대기업·중견 위주로 수십 곳 지원. 맞춤 작성 없이 복붙하다 서류 탈락 반복.
#   - P2 직무적격형 지원자. 부트캠프 수료, 개발 직무 확정, 스타트업·중견 중심 소수 지원. 한 건에 공을 많이 들여 지원 수가 적고 코테·과제 일정이 겹침.
experiences:
  - id: E1
    when: 2026년 초
    what_happened: >-
      소프트웨어 마에스트로 면접. 떨려서 제대로 답을 못 하고 꼬리질문에 막혔다.
      준비한 답만 외우다 보니 꼬리질문에 경험을 못 꺼냈다. 처음 해 보는 면접이라 어떻게 진행되는지 몰랐다.
    workaround: null
    feeling: 떨렸다
    quote: null
    source: 팀원 본인 경험(2026-10-29 대화). 막힌 질문 내용·그때 한 말·끝나고 한 일은 학생 답 대기
# 다른 팀원들도 각자 면접 때문에 고민한 경험이 있다(2026-10-29). 언제·어느 면접인지는 학생 답 대기.
