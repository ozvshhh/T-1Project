# T1 팀 문제정의. 종이 캔버스(2026-10-29, 팀원 JW·TK·HN·SG·HE)와 팀이 만든 초안(2026-10-29)에서 옮김.
# "(팀 초안)" 표시는 종이에는 없고 팀이 초안으로 적은 내용이다. 2-A에서 다지면서 고친다.
# 종이와 초안에 없는 내용은 null 또는 []로 둔다.
# 초점: 정량 전형(서류·인적성·코테)을 통과한 뒤 면접 정성평가에서 당황하는 구직자. 아래 personas 이하는 서류 탈락 기준의 이전 초안이라 아직 이 초점에 맞춰 고치지 않았다.

statement: >-
  (팀 초안) 서류·인적성·코테 같은 정량 전형을 통과해 면접에 올라온 졸업예정 구직자는,
  면접 직전 며칠~당일 질문이 예상 밖으로 꼬리를 물 때 내 경험을 질문에 맞춰 바로 꺼내
  구조화하지 못해 머리가 하얘지고 준비한 만큼 평가받지 못한다.
  지금은 예상 질문 답안을 외우고 스터디·모의면접으로 버티지만,
  외운 범위를 벗어난 질문과 압박 상황의 대응은 여전히 남는다.
canvas:
  context: |-
    시간: 4학년 2학기, 졸업예정자, 취준생
    장소: 학교, 자취방, 부트캠프 ... 어디서든
    반복양상: 취준생 취업시즌 → 채용공고 → 면접 → 결과확인
      ① 채용공고 확인
      ② 지원하기 ← 템플릿에 맞게 지원서 작성 (난사 / 직무적격) 특정회사(대기업·공기업·스타트업·중견)
      ③ 서류 검토 → 2. 인적성/AI면접/코테 → 3. 면접(임원, 기술...)
    특징: 채용서류에 몰린다. 병렬적으로 진행됨. 매일 수요가 존재.
    (팀 초안) 초점 장면: 정량 전형을 통과해 면접(임원·실무·기술)에 진입한 시점.
      정량 평가는 점수·정답이 있어 준비 방법이 분명하지만 정성평가는 기준이 보이지 않는다.
      면접마다 질문과 면접관이 달라 같은 준비가 통하지 않는다.
  customer: |-
    구직자
    회사
    (팀 초안) 1차 고객: 정량 전형은 통과했지만 면접에서 탈락을 반복하는 졸업예정 구직자. '회사'(면접관 쪽)는 보류.
  root_problem: >-
    (팀 초안) 준비 방식이 정답 암기에 치우쳐 있어, 질문이 바뀌면 내 경험을 질문 의도에 맞게
    꺼내는 훈련이 안 되어 있다. 정성평가는 피드백이 없어 왜 떨어졌는지 몰라 무엇을 고칠지 알 수 없다. (가설)
  impact:
    feeling: >-
      (팀 초안, 가설) "머리가 하얘졌다", "준비한 건 다 말도 못 했다", 끝나고 남는 후회와 자기 의심.
      인터뷰로 실제 표현 확인 필요.
    measurable: |-
      (팀 초안) 측정할 지표만 정함. 값은 아직 없음(인터뷰·설문으로 채울 예정).
      - 면접 진출 횟수 대비 최종 합격률
      - 면접 준비에 쓴 시간
      - 정량 전형 통과 뒤 면접에서 탈락한 건수
  alternatives:
    # (팀 초안) 단점은 팀 초안. 인터뷰로 확인 예정. why_ours는 2-B에서 채움.
    - how_used: 예상 질문 목록을 만들어 답변을 써서 외움
      shortcoming: 외운 범위를 벗어난 꼬리질문에서 바로 무너지고, 외운 티가 남는다.
      why_ours: null
    - how_used: 스터디·친구와 모의면접, 학교 취업센터·부트캠프 멘토 면접 코칭
      shortcoming: 일정을 맞추기 어렵고 매일 하기 어려우며, 피드백 품질이 사람에 따라 다르다.
      why_ours: null
    - how_used: 생성형 AI·모의면접 서비스로 질문과 답변 연습
      shortcoming: 내 실제 경험을 모르면 일반적인 피드백이 나오고, 압박 상황의 긴장감이 재현되지 않는다.
      why_ours: null
personas:
  - id: P1
    description: 난사형 지원자. 4학년 2학기, 직무 미확정, 대기업·중견 위주로 수십 곳 지원. 맞춤 작성 없이 복붙하다 서류 탈락 반복.
    source: (팀 초안) 가설 페르소나, 인터뷰로 검증 필요
  - id: P2
    description: 직무적격형 지원자. 부트캠프 수료, 개발 직무 확정, 스타트업·중견 중심 소수 지원. 한 건에 공을 많이 들여 지원 수가 적고 코테·과제 일정이 겹침.
    source: (팀 초안) 가설 페르소나, 인터뷰로 검증 필요
experiences: []
sources: []
five_whys:
  symptom: (팀 초안) 서류 전형에서 반복적으로 탈락한다.
  whys:
    - 지원서가 회사·직무에 맞춰져 있지 않다.
    - 같은 템플릿을 복사해 조금씩만 고쳐 낸다.
    - 동시에 진행 중인 지원 건이 많아 건당 쓸 시간이 부족하다.
    - 공고 확인부터 작성·일정 관리까지 매번 처음부터 손으로 한다.
    - 내 경험 소재와 회사·직무 요구를 연결해 재사용하는 체계가 없다.
# 2-B에서 결정(chosen/rejected/deferred)한 뒤 항목으로 옮긴다. 팀 초안의 해법 후보:
#   - 경험 소재를 한 번 정리해 두고 문항·직무에 맞춰 재조합
#   - 공고의 요구 역량을 뽑아 내 경험과 매칭
#   - 지원 건별 전형 단계·마감을 한 곳에서 추적
#   - 지원 결과를 쌓아 통과/탈락 패턴 회고
solution_paths: []
insight:
  claim: >-
    (팀 초안) 구직자에게 부족한 것은 글쓰기 실력보다 '이미 가진 경험을
    지원 건마다 빠르게 맞춰 재사용하는 구조'다.
  evidence: null
  design_decision: >-
    (팀 초안) 자소서를 대신 써주기보다, 경험 소재 정리와 공고-경험 매칭을
    중심에 둔다.
# 2-C에서 입력·결과·완료 조건을 정한 뒤 항목으로 옮긴다. 팀 초안의 기능 후보:
