five_whys:
  symptom: (팀원 경험 E1) 면접에서 꼬리질문에 막혔다.
  whys:  # 팀원 답 그대로(2026-10-29)
    - 준비한 답만 외워서 꼬리질문에 경험을 못 꺼냈다.
    - 면접에서 뭘 물어볼지 몰라서 예상 질문 답만 외웠다.
    - 처음 해 보는 면접이었다.
    - 면접이 어떻게 진행되는지 몰랐다.
    - 알아봐도 잘 감이 안 왔다.
