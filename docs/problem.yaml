    output: 면접 화면에 내 카메라 영상을 보여 주기만 한다(저장·전송 없음). 카메라가 없거나 꺼져 있으면 그 자리에 검은 화면이 보인다.
    done: 카메라를 허용하면 면접 화면에 내 영상이 보이고, 카메라가 없는 브라우저(자동 테스트 포함)에서는 검은 화면이 보이며 면접은 그대로 진행된다.
