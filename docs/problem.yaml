five_whys:
  # 2026-10-30 근거에 맞춰 교체. 이전 Why 3(경험 스캐너를 안 써서)은 해법이 원인 자리에 든 순환 논리라 뺌.
  symptom: 취준생이 자소서와 면접에서 자기 경험과 기여를 구체적으로 설명하지 못한다(면접 후회 1위 50.1%) [S9]
  whys:
    - 문항·질문에 맞는 경험을 바로 꺼내지 못해서(무엇을 써야 할지 막막 69.9%) [S3]
    - 경험을 평소에 정리해 두지 않아서(47.3%) [S2]
    - 정리하는 대신 AI 초안이나 합격 자소서로 문장을 채워서(84%, 50.3%) [S6][S3]
    - "(근본 문제, 가설) 지원하기 전에 내 경험을 꺼내 정리하고, 내 말로 설명해 보는 단계가 빠져 있다"
# 팀 답 그대로(2026-10-29). 세 경로 모두 팀이 "우리가 개발할 대화형 자소서 및 압박 면접 훈련 웹서비스"의 단계로 선택함.
solution_paths:
  - path: |-
      경험 스캐너 (발굴 및 구조화)
      - 유저가 빈칸을 채우는 것이 아니라, AI 챗봇이 "당시 갈등 상황은 어땠나요?", "본인이 낸 아이디어는 무엇이었나요?" 등 꼬리질문을 던지며 과거 프로젝트의 파편화된 기억을 대화로 캐묻는다.
      - 이 대화 로그를 바탕으로 AI가 유저의 경험을 STAR(상황-과제-행동-결과) 구조의 객관적 데이터로 자동 정제하여 개인 '경험 포트폴리오'로 아카이빙한다.
    status: chosen
    reason: null
  - path: |-
      맞춤형 자소서 빌더 (증명 및 문서화)
      - 정제된 STAR 데이터를 활용해 지원 기업의 직무 공고와 자소서 문항에 최적화된 초안을 도출한다.
      - "소통하여 해결했다"는 상투적 표현 대신, 추출된 데이터 기반의 '구체적 기여도(%)와 문제 해결 과정'이 명확히 담긴 차별화된 결과물을 제공한다.
    status: chosen
    reason: null
  - path: |-
      내 경험 기반 음성 모의면접 (실전 방어 훈련)
      - 시중에 있는 뻔한 일회성 면접 질문(예: "우리 회사 왜 지원했나요?")을 배제한다.
      - AI 면접관이 유저의 '자소서와 정제된 경험 데이터'의 맹점을 파고드는 다대일 압박 꼬리질문(예: "거기서 본인 빼도 결과는 똑같았을 것 같은데요?")을 실시간 음성으로 던진다.
      - 유저가 즉석에서 마이크로 답변하는 훈련을 반복시켜, 대본 암기 습관을 부수고 실전 담력과 논리적 순발력을 기른다.
    status: chosen
    reason: null
# reason(고른 이유)은 팀이 따로 말하지 않아 null로 둠. 학생 답 대기.
# 2026-10-30 근거에 맞춰 claim을 고침. "경험의 부재가 아니다"는 S3(쓸 만한 스토리가 없어서 49.3%)와 부딪혀 대상을 좁히는 문장으로 바꿈.
# evidence는 팀원 수정안(2026-10-29 밤) 그대로.
insight:
  claim: |-
    1. 자소서가 어려운 이유로 "쓸 스토리가 없다"(49.3%) [S3]와 "평소에 정리하지 않았다"(47.3%) [S2]가 함께 나온다.
       우리는 이 중 경험은 있지만 정리되지 않은 사람을 대상으로 한다.
    2. 취준생은 이미 AI로 문장을 만들고 있다(84%) [S6]. 부족한 것은 문장이 아니라 그 문장에 담길 내 경험이다(가설).
    3. 면접에서 가장 후회하는 것은 "답변을 제대로 말하지 못한 것"(50.1%) [S9]이다.
       서류를 쓰기 전에 경험을 말로 꺼내 보는 연습이 필요하다(가설: 효과는 검증 대상).
  evidence: >-
    E1에서는 예상 답변을 외워 준비했지만 꼬리질문에서 자신의 경험을 설명하지 못했다.
    E2에서는 협업 과정과 본인의 기여도를 자소서로 구체화하기 어려웠다.
    E1은 선발 면접, E2는 서류 작성 사례이므로 핵심 고객의 수요나 서비스 효과를 입증하는 자료로 일반화하지 않는다.
  design_decision: >-
    우리가 개발할 '대화형 자소서 및 압박 면접 훈련 웹서비스'는 위 통찰을 바탕으로 3단계(경험 스캐너 → 맞춤형 자소서 빌더 → 내 경험 기반 음성 모의면접)의 논리적 해결책을 제공한다.
features:
  # 출처: 팀원 설계 docs/interview-design.md(2026-10-29)와 학생 답(2026-10-29 밤). 설계에 없는 것은 "학생 답 대기"로 주석.
  # 사용자가 넣는 것 → 저장·보이는 결과 → 관찰할 수 있는 완료 조건.
  - id: F1
    name: 회원가입·로그인
    input: 이메일·비밀번호
    output: 취준생 계정이 만들어지고 로그인 상태가 된다. 역할은 취준생 하나. 이력서·자기소개서·면접 기록은 계정별로 따로 남는다.
    done: 아이디/비밀번호로 바로 로그인되고, 다시 접속해도 내 이력서·자기소개서·면접 기록이 그대로 보인다. 로그인 전에는 로그인 필요 화면이 열리지 않는다.
  # F1 역할: 취준생 하나만(학생 답 2026-10-29). 흐름 account·시드 계정 역할 이름으로 그대로 씀.
  - id: F2
    name: 이력서 템플릿 입력
    input: >-
      9개 항목(1분 자기소개, 직무 관련 성공경험, 직무를 위해 준비한 사항, 지원동기, 입사 후 포부, 성격의 장단점,
      위기 극복 경험, 성장과정, 팀워크 및 협업경험) 중 원하는 항목 선택 → 고른 항목마다 생긴 칸에 글 입력
    output: 고른 항목과 입력한 글이 내 이력서로 저장된다.
    done: >-
      항목 3개를 골라 채우고 저장하면 다시 접속해도 같은 3개 항목과 내용이 보인다.
      항목을 하나도 안 고르거나 칸을 비운 채 저장하면 경고가 보이고 저장되지 않으며 다시 입력하게 된다.
      저장 뒤 내용 수정과 항목 추가가 된다. (학생 답 2026-10-29)
  - id: F3
    name: 맞춤형 자기소개서 만들기(템플릿 선택)
    input: >-
      지원할 기업(직접 기술) + 본인 직무기술(자기소개 글) → AI가 제시한 템플릿 중 하나 선택
    output: >-
      AI가 고른 템플릿 양식에 맞춰 자기소개서를 수정해 보여 주고, 내 자기소개서 목록에 저장한다.
    done: >-
      기업과 직무기술을 입력하면 AI가 템플릿을 제시하고, 하나를 고르면 그 양식으로 수정된 자기소개서가 화면에 보인다.
      내 자기소개서 목록에 저장돼 다시 접속해도 보이고 모의면접(F5)에서 고를 수 있다. AI 호출이 실패하면 에러가 표시되고 저장되지 않는다.
  # F3 (학생 답 2026-10-29) 이전 "이력서로 초안 생성"을 이 기능으로 대신한다. 기업은 직접 기술, 결과는 내 자기소개서 목록에 저장되어 모의면접에서 고를 수 있다. AI 실패 시 에러 표시(이전 F3 답 유지).
  # 학생 답 대기: 이력서(F2)를 이 기능에 쓰는지, AI가 제시하는 템플릿 개수·종류, 입력이 비었을 때 동작, 수정 결과를 사용자가 고칠 수 있는지.
  - id: F4
    name: 기존 자기소개서 등록
    input: 이미 쓴 자기소개서 글 붙여넣기
    output: 내 자기소개서로 저장된다. 자기소개서는 여러 개 둘 수 있다.
    done: 붙여 넣고 저장하면 자기소개서 목록에 보이고 다시 접속해도 그대로다. 빈 글은 저장되지 않고 이유를 보여 준다.
  # F4 (학생 답 2026-10-29) 자기소개서는 여러 개 둘 수 있다. 빈 글 저장 안 됨 확인.
  - id: F5
    name: 모의면접 시작(본질문 생성)
    input: 내 자기소개서 하나 선택 → "면접 시작"
    output: >-
      AI 호출 한 번으로 본질문 4개(실무 면접관 2·임원 면접관 2)를 자기소개서에 맞춰 만들고, 질문마다 면접관·확인 목적·근거 자기소개서 문장을 함께 저장한다.
      순서는 세션 생성 때 한 번 랜덤으로 정해 저장한다. 생성에 실패하면 기본 질문 템플릿을 쓰고 그 상태를 기록한다.
      첫 질문이 화면에 글자로 보이고 TTS로 읽어 준다.
    done: 면접 시작 뒤 첫 질문(면접관 이름 포함)이 글자로 보이고, 새로고침해도 같은 질문·같은 순서다.
