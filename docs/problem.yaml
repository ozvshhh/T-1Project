# T1 팀 문제정의. 종이 캔버스(2026-10-29, 팀원 JW·TK·HN·SG·HE)와 팀이 만든 초안(2026-10-29)에서 옮김.
# "(팀 초안)" 표시는 종이에는 없고 팀이 초안으로 적은 내용이다. 2-A에서 다지면서 고친다.
# 종이와 초안에 없는 내용은 null 또는 []로 둔다.

statement: >-
  (팀 초안) 취업 시즌의 졸업예정 구직자는 여러 회사에 동시에 지원하면서
  회사·직무마다 지원서를 맞춰 쓰고 전형 일정을 관리해야 하는데,
  시간이 부족해 '난사'와 '직무 맞춤' 사이에서 계속 타협하게 되고
  그 결과 서류 단계에서 반복적으로 탈락한다.
canvas:
  context: |-
    시간: 4학년 2학기, 졸업예정자, 취준생
    장소: 학교, 자취방, 부트캠프 ... 어디서든
    반복양상: 취준생 취업시즌 → 채용공고 → 면접 → 결과확인
      ① 채용공고 확인
      ② 지원하기 ← 템플릿에 맞게 지원서 작성 (난사 / 직무적격) 특정회사(대기업·공기업·스타트업·중견)
      ③ 서류 검토 → 2. 인적성/AI면접/코테 → 3. 면접(임원, 기술...)
    특징: 채용서류에 몰린다. 병렬적으로 진행됨. 매일 수요가 존재.
  customer: |-
    구직자
    회사
  root_problem: >-
    (팀 초안) 병렬로 진행되는 다수 지원 건에서, 회사·직무별로 지원서를 맞춤화하는 데
    드는 시간과 노력이 구직자가 감당할 수 있는 양을 넘는다.
  impact:
    feeling: >-
      (팀 초안) 매일 마감에 쫓기는 피로감, 같은 경험을 반복해서 고쳐 쓰는 소모감,
      탈락 이유를 모른 채 쌓이는 불안.
    measurable: |-
      (팀 초안) 측정할 지표만 정함. 값은 아직 없음(인터뷰·설문으로 채울 예정).
      - 지원서 1건 작성 소요 시간
      - 동시에 진행 중인 지원 건수
      - 서류 전형 통과율
      - 놓친 마감·일정 건수
  alternatives:
    # (팀 초안) 단점은 팀 초안. 인터뷰로 확인 예정. why_ours는 2-B에서 채움.
    - how_used: 채용 플랫폼(공고 탐색·즐겨찾기)
      shortcoming: >-
        공고를 찾는 데서 끝나고 지원서 작성은 각 회사 양식으로 따로 해야 한다.
        플랫폼 밖 지원(자사 채용 사이트, 공기업)은 현황이 흩어진다.
      why_ours: null
    - how_used: 엑셀/노션으로 지원 현황 직접 관리
      shortcoming: >-
        입력·갱신을 전부 손으로 해서 바쁜 시즌일수록 업데이트가 끊긴다.
        일정은 관리돼도 지원서 맞춤화 부담은 그대로다.
      why_ours: null
    - how_used: 합격 자소서 열람 서비스
      shortcoming: >-
        남의 경험이라 내 소재와 연결해주지 않는다.
        따라 쓰면 비슷한 글이 되고, 유료인 경우가 많다.
      why_ours: null
    - how_used: 생성형 AI로 자소서 초안 작성
      shortcoming: >-
        내 실제 경험을 모르면 일반적인 문장이 나와 차별성이 없다.
        건마다 경험을 다시 설명해야 하고, AI 작성 티가 날까 불안하다.
      why_ours: null
    - how_used: 스터디·첨삭(학교 취업센터, 부트캠프 멘토)
      shortcoming: >-
        품질은 좋지만 일정 맞추기와 대기 시간이 길어 매일 생기는 수요를 못 따라간다.
        소수 핵심 지원 건에만 쓰게 된다.
      why_ours: null
personas:
  - id: P1
    description: 난사형 지원자. 4학년 2학기, 직무 미확정, 대기업·중견 위주로 수십 곳 지원. 맞춤 작성 없이 복붙하다 서류 탈락 반복.
    source: (팀 초안) 가설 페르소나, 인터뷰로 검증 필요
  - id: P2
    description: 직무적격형 지원자. 부트캠프 수료, 개발 직무 확정, 스타트업·중견 중심 소수 지원. 한 건에 공을 많이 들여 지원 수가 적고 코테·과제 일정이 겹침.
    source: (팀 초안) 가설 페르소나, 인터뷰로 검증 필요
experiences: []
sources: []
five_whys:
  symptom: (팀 초안) 서류 전형에서 반복적으로 탈락한다.
  whys:
    - 지원서가 회사·직무에 맞춰져 있지 않다.
    - 같은 템플릿을 복사해 조금씩만 고쳐 낸다.
    - 동시에 진행 중인 지원 건이 많아 건당 쓸 시간이 부족하다.
    - 공고 확인부터 작성·일정 관리까지 매번 처음부터 손으로 한다.
    - 내 경험 소재와 회사·직무 요구를 연결해 재사용하는 체계가 없다.
