# T1 팀 문제정의. 종이 캔버스(2026-10-29, 팀원 JW·TK·HN·SG·HE)와 팀이 만든 초안(2026-10-29)에서 옮김.
# "(팀 초안)" 표시는 종이에는 없고 팀이 초안으로 적은 내용이다. 2-A에서 다지면서 고친다.
# 종이와 초안에 없는 내용은 null 또는 []로 둔다.
# 최신 정리본(2026-10-29, 팀이 최신으로 확정): 캔버스 ①~⑥을 canvas에 옮김. "(정리본)" 표시가 이 내용이다.
# 이전 초점(2026-10-29): 정량 전형(서류·인적성·코테)을 통과한 뒤 면접 정성평가에서 당황하는 구직자.
#   이유: 서류 쪽은 비슷한 서비스가 많지만 면접 쪽은 그렇지 않아 면접에 집중하는 게 경쟁력이 있다고 봄. Claude로 검색해 확인, 출처는 없음(팀 판단).

# statement: 팀이 최신 정리본 기준으로 확정한 한 문장(2026-10-29).
statement: >-
  정량적 스펙 중심으로 준비해 온 취준생이 자신의 구체적인 기여도와 문제 해결 역량을
  논리적으로 설명하지 못해, 서류 작성을 어려워하고 실전 압박 면접에서 무너지는 문제
canvas:
  context: |-
    (정리본) 기존 종이 내용 + 보강
    시간: 4학년 2학기·졸업예정자·취준생. 상/하반기 공채 시즌, 공고가 뜬 뒤 ~ 면접 직전에 집중 발생
    장소: 학교, 자취방, 부트캠프 … 어디서든
    반복 양상 (1인 기준): 공고 확인 → 직무 보고 "내 경험 중 뭘 녹일지" 고민 → 템플릿 지원서(사진·경험·프로젝트·포폴·자소서) 작성
      → 서류 → AI역검/인적성/코테 → 1·2차 면접(실무·임원) → 결과 확인 → 다음 공고로 반복
    특징: 채용 시즌에 몰림, 병렬 지원(난사 / 직무 저격 / 특정 회사·기업유형), 높은 매일 수요.
      경력이 없어 경험을 쌓고 싶어도 뽑아주지 않는 순환 구조
  customer: |-
    구직자
    회사
    (정리본)
    1차 고객: 구직자 — 처음 구직하는 취준생
      4학년 2학기, 프로젝트 7~8개·해커톤·동아리·대외활동은 했지만 블로그/기록이 없어
      "내가 한 걸 말 말고는 증명할 수 없는" 사람
      서류는 붙는데 면접에서 떨어지거나, 경험은 많은데 직무에 맞게 어필할 줄 모르는 사람
      (확장) 취업 정보 과잉으로 뭘 먼저 할지 모르는 2~3학년
    2차(보조): 회사 — 서류가 다 비슷해 실제 역량을 가려내기 힘든 채용 담당자.
      단, 멘토 조언대로 무게중심은 취준생 한쪽에 둠
    (팀 답 2026-10-29) 무게중심을 구직자에 둔 이유: 구직자가 팀 상황에 더 가깝고 공감할 수 있어서.
      팀원들도 각자 면접 때문에 고민한 경험이 있다. 팀 밖에서 겪은 사람은 학생 답 대기.
  root_problem: |-
    (정리본)
    왜 생기나
    - 경험은 있는데 구조화·증명이 안 됨 — 활동 당시 기록을 남기지 않고, 면접에서 "상황-과제-행동-결과"로 설명하는 훈련이 없음.
      AI가 써준 자소서는 길고 다 비슷해 변별이 사라짐
    - 정보 비대칭 — 기업은 원하는 역량·인재상·내부 의도를 공개하지 않고 불합격 사유도 알려주지 않음.
      신입은 직무 인맥이 없어 지인 추천·커피챗 같은 "사람 통로"가 막혀 있음
    - 기업은 서류로 실제 역량을 판별 못 해 정량 컷(학점·어학·자격증)으로 거르고, 신입은 레퍼런스 체크도 불가
      → 정성 역량이 평가 테이블에 올라가지 못함
    왜 아직 못 고쳤나
    - 기존 서비스(인프런·잡다·원티드·하이잡)는 일반 강의·일회성 모의면접이라 "내 경험"에서 출발하지 않고,
      시즌에만 쓰여 데이터가 쌓이지 않음
    - 범용 AI(GPT/Claude)는 넣은 것만 다듬을 뿐 캐묻지 않음 — 재료(경험) 자체를 끌어내는 단계가 없음
    - 기업·구직자 양면을 동시에 풀려다 어느 쪽도 뾰족하게 정의되지 못함
  impact:
    feeling: |-
      (팀원이 그 상황에서 실제로 느낀 것, 2026-10-29 확인) "머리가 하얘졌다", "준비한 건 다 말도 못 했다",
      끝나고 남는 후회와 자기 의심.
      (정리본) 그때 한 말·기분: "내 역량은 100인데 면접장만 가면 30이 되는 것 같아",
      "동아리 회장·프로젝트 다 했는데 증명할 게 없네",
      "누구는 자격증부터, 누구는 면접부터 하라는데 뭘 먼저 해야 하지", 막막함·불안·자신감 하락
    measurable: |-
      (정리본) 잃는 시간·횟수·기회: 지원 건당 수십 시간의 자소서, 면접 기회 자체(서류 탈락),
      상·하반기 시즌 한 번(=반년), 토익·자격증 학원비. 기업도 괜찮은 인재를 놓침
      ("수십 시간"의 출처·추정 여부는 학생 답 대기)
      (팀 초안) 측정할 지표만 정함. 값은 아직 없음. 팀 결정(2026-10-29): 지금은 지표 이름만 둔다.
      - 면접 진출 횟수 대비 최종 합격률
      - 면접 준비에 쓴 시간
      - 정량 전형 통과 뒤 면접에서 탈락한 건수
  alternatives:
    # (정리본) ⑤ 현재 대안 A1~A3와 ⑥ 단점을 짝지음. why_ours는 2-B에서 채움.
    - how_used: |-
        A1: 자소서를 GPT/Claude에 넣고 다듬기, 예상 질문 뽑아 혼자 거울·카메라 앞에서 연습
      shortcoming: |-
        입력한 내용만 매끈해지고 내 경험을 캐물어 끌어내거나 STAR로 재구성하지 않음.
        기업 맥락·평가 기준이 없어 "잘 썼는지" 판단 불가, 결과물이 남들과 똑같아짐
      why_ours: null
    - how_used: |-
        A2: 유튜브 면접 영상, 인프런 강의, 잡다·원티드 등 AI 모의면접을 시즌에만 사용
      shortcoming: |-
        일반론·일회성. 내 프로젝트에 대한 꼬리질문·압박면접이 아니라 실제 면접에서 막힘. 피드백이 점수화되지 않음
      why_ours: null
    - how_used: |-
        A3: 친구 면접 스터디, 취업한 선배·지인에게 "그 회사 어떻게 뽑아?" 묻기, 기사로 회사 방향 분석, 노션 포폴 템플릿 정리
      shortcoming: |-
        신입은 지인이 없어 애초에 불가능한 경우가 많고, 있어도 조언이 주관적.
        기사는 대외용이라 실제 채용 의도를 모름. 포폴·기록 정리는 귀찮아서 결국 안 하게 됨
      why_ours: null
personas: []
experiences:
  - id: E1
    when: 2026년 초
    what_happened: >-
      소프트웨어 마에스트로 면접. 떨려서 제대로 답을 못 하고 꼬리질문에 막혔다.
      준비한 답만 외우다 보니 꼬리질문에 경험을 못 꺼냈다. 처음 해 보는 면접이라 어떻게 진행되는지 몰랐다.
    workaround: null
    feeling: 떨렸다
    quote: null
    source: 팀원 본인 경험(2026-10-29 대화). 막힌 질문 내용·그때 한 말·끝나고 한 일은 학생 답 대기
  - id: E2
    when: 약 1년 전(2026-10-29 기준)
    what_happened: >-
      국내 주요 콘텐츠·IT 플랫폼 기업의 '서비스 기획(PM) 및 콘텐츠 에디터' 연계형 인턴 공고.
      포트폴리오 파일 제출보다 자기소개서의 '협업 과정 및 갈등 해결 에피소드'와 '구체적 기여도(%)'를 정밀하게 요구한 서류 전형.
      자기소개서 문항 "팀 프로젝트 중 이견을 조율하고 문제를 해결한 과정과 본인의 구체적인 기여도를 서술하시오" 앞에서 막혔다.
      어떤 답변이 내 경험을 살리면서 좋은 자기소개서가 될지 몰랐다.
      쌓아 온 과정을 정제하고 기업에 맞춰 자소서를 매번 각각 작성하는 일이 어려웠다.
    workaround: >-
      어떻게든 써서 냈지만 좋은 성과가 따라주지 않았다.
      자소서를 직접 작성하는 동안 다른 기업에 서류를 넣을 시간이 부족했다.
      (팀이 지인 이야기를 듣고 정리) 팀장을 맡아 갈등을 중재했지만 제출할 회의록·데이터가 없어
      상투적인 문장("경청하고 소통해서 잘 해결했다")을 쓸 수밖에 없었다. 며칠 동안 붙잡고 겨우 냈지만 서류에서 불합격했고,
      그러느라 같은 주에 마감이던 다른 기업 두 곳은 서류를 써 보지도 못했다.
    feeling: |-
      (팀이 지인 이야기를 듣고 정리)
      문항 앞에서 막혔을 때: 억울함과 깊은 자괴감, 실제 협업 노력을 객관적인 증거로 증명하지 못하는 무력감
      결과가 좋지 않았을 때: 허탈함과 심한 초조함, 한 공고에 시간을 다 빼앗겨 다른 기업 서류 기회까지 날려버린 공포
    quote: null
    source: 팀원의 지인(4학년 취준생)의 경험. 팀원이 지인에게 직접 들음(2026-10-29 대화). 지인이 한 말 그대로의 인용은 없음(팀이 다듬은 말이라 quote에 넣지 않음)
  - id: E4
    when: 몇 달 전(2026-10-29 기준)
    what_happened: >-
      마케팅/영업 직무 지원자. 대기업 실무진 다대일 압박 면접.
      "성과가 좋았다고 적혀 있는데, 여기서 본인의 역할을 빼도 전체 결과에 차이가 없지 않나?"라는 압박 꼬리질문을 받았다.
      원인(팀이 친구 이야기를 듣고 정리한 말, 친구가 직접 한 말은 아님): 외운 대본에 의존해 성과(Result)만 늘어놓았을 뿐, 압박 상황에서 내 주도적 행동(Action)을
      말로 즉석에서 풀어내는 실전 음성 순발력 및 담력 훈련이 안 되어 있었다.
    workaround: >-
      외운 대본에 의존해 성과만 늘어놓았다. 외운 범위를 벗어나자 답변이 중단됐다.
    feeling: >-
      머리가 하얗게 비었다. 면접 울렁증이 심해져 이후 지원 자체를 두려워하게 됐다.
    quote: >-
      "외운 대본에서 한 발짝만 벗어나니까 진짜 입도 뻥긋 못 하겠더라. 면접관이 '거기서 본인 빼도 결과는 똑같았을 것 같은데요?' 하고 딱 찌르는데,
      순간 머리가 새하얘지면서 어버버하다 정적만 흘렀어. 외운 문장 말고는 내 진짜 행동을 말로 바로 뱉어내는 실전 훈련이 전혀 안 되어 있다는 걸 깨닫고 나니까,
      이젠 면접장에 들어가는 것 자체가 너무 무서워."
    source: 친구의 경험. 팀이 "인터뷰/실제 사례 4"로 전달함(2026-10-29 대화). 정확한 면접 시점은 "몇 달 전"까지만 확인됨
